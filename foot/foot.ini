include=~/.config/foot/inir-colors.ini
# ==========================================
# Foot Configuration
# ==========================================

[main]
title=foot
pad=30x25

font=JetBrains Mono Nerd Font:style=Regular:size=11.3

[cursor]
style=beam
blink=no
beam-thickness=1.5

[colors-dark]
alpha=0.95
alpha-mode=matching
blur=true

[scrollback]
lines=10000
multiplier=3.0

# ==========================================
# Key Bindings
# ==========================================

[key-bindings]
search-start=Control+Shift+f

[search-bindings]
cancel=Escape
find-prev=Shift+F3
find-next=F3 Control+g
