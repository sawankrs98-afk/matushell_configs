# Active Coding Font Configuration
# Managed by Neovim Font Customizer (:FontCustomize / <leader>fc)
font_family      family="Mononoki Nerd Font" style="Regular"
bold_font        family="Mononoki Nerd Font" style="Bold"
italic_font      family="Mononoki Nerd Font" style="Italic"
bold_italic_font family="Mononoki Nerd Font" style="Bold Italic"
font_size 13.0

modify_font cell_height 102%
modify_font cell_width 100%
disable_ligatures never
