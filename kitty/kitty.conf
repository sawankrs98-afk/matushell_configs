# --- Theme
include matugen.conf

# -- Core Settings ---
term xterm-kitty
allow_remote_control yes
listen_on unix:/tmp/mykitty
confirm_os_window_close 0
linux_display_server wayland
remember_window_size no

# --- Typography ---
font_family      JetBrainsMono Nerd Font Mono
bold_font        auto
bold_italic_font auto
bold_italic_font auto
font_size        11.3
text_composition_strategy platform

# --- Cursor  ---
cursor_shape          beam
cursor_beam_thickness 1.5
cursor_trail          1

# --- Visuals & Transparency ---
background_opacity         0.95
dynamic_background_opacity yes
background_blur            1
window_padding_width       25

# --- Tab bar ---
tab_bar_edge bottom
tab_bar_style powerline

# --- URL & Interaction ---
detect_urls yes
url_style   curly
undercurl_style thin-dense
copy_on_select clipboard
strip_trailing_spaces smart

# --- Scrollback ---
scrollback_lines 10000
wheel_scroll_min_lines 1

# --- Window Management & Panes ---
enabled_layouts splits
inactive_text_alpha   0.5
dim_opacity           0.8

# --- Keybinds ---
map ctrl+shift+f      show_scrollback
map page_up           scroll_page_up
map page_down         scroll_page_down

# Manual split keybinds
map ctrl+shift+enter  launch --location=vsplit
map ctrl+shift+\      launch --location=hsplit

# Explicitly allow clicking URLs with Ctrl+Left Click
mouse_map ctrl+left click ungrabbed mouse_handle_click selection link prompt

# If you're inside Neovim or a TUI and want Ctrl+Click to still work
mouse_map ctrl+left click grabbed mouse_handle_click selection link prompt

# Reduce the delay before redrawing (default is 10)
repaint_delay 2

# Reduce the input batching delay (default is 3)
input_delay 0
include current-theme.conf

# Font choice managed by the Neovim font picker
include font.conf
